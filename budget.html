<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F5F4EE">
<title>予算ダッシュボード｜SHINTAKU ToDo</title>
<link rel="icon" href="favicon.png">
<!-- 予算計画用のダッシュボード（やましん専用・アプリからはリンクしない）
     データは ToDo アプリと同じ GAS（スプレッドシート）から読む。
     計画ボードでタイルを動かすと「計画月」（L列）だけが変わる。目標日や内容は変えない。 -->
<style>
  :root {
    --bg: #F5F4EE; --card: #FFFFFF; --ink: #1f2421; --ink-2: #4a504c; --ink-sub: #8a8f8b; --line: #e8e7df; --grid: #eeede6;
    --c-green: #5B8C3E; --c-orange: #E58A00; --c-red: #D0453A; --c-blue: #2563EB; --c-gray: #9aa0a6; --c-star: #EFA400;
    --plan: #E58A00;   /* 予定（未完了）の系列 */
    --done: #2563EB;   /* 完了の系列（アプリの「完了＝青」と同じ） */
    --font: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-text-size-adjust: 100%; }
  body { min-height: 100vh; padding: 0 16px 60px; }
  button, input { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 1320px; margin: 0 auto; }
  .num { font-variant-numeric: tabular-nums; }

  /* ヘッダー */
  .top { display: flex; align-items: center; gap: 12px; padding: calc(16px + env(safe-area-inset-top, 0px)) 0 14px; }
  .top img { width: 40px; height: 40px; border-radius: 50%; }
  .top .ttl { flex: 1; min-width: 0; }
  .top .ttl small { display: block; font-size: 12px; font-weight: 700; color: var(--ink-sub); }
  .top .ttl b { display: block; font-size: 20px; font-weight: 900; letter-spacing: .02em; }
  .top .upd { font-size: 12px; color: var(--ink-sub); white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; font-size: 14px; font-weight: 800; }
  .btn:hover { border-color: #cfcec5; }
  .btn svg { width: 18px; height: 18px; }
  .btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn.link { text-decoration: none; color: var(--ink); }

  .card { background: var(--card); border-radius: 20px; padding: 18px 18px 16px; box-shadow: 0 1px 0 rgba(31,36,33,.04), 0 6px 20px rgba(31,36,33,.05); }
  .card h2 { font-size: 15px; font-weight: 900; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin-bottom: 12px; }
  .card h2 > small { flex: 1 1 200px; }
  .card h2 small { font-size: 12px; font-weight: 700; color: var(--ink-sub); }

  /* 集計タイル */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .kpi { padding: 16px 18px; }
  .kpi .lb { font-size: 12.5px; font-weight: 800; color: var(--ink-sub); display: flex; align-items: center; gap: 6px; }
  .kpi .lb i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .kpi .v { font-size: 28px; font-weight: 900; margin-top: 6px; letter-spacing: .01em; }
  .kpi .v small { font-size: 14px; font-weight: 800; margin-left: 2px; }
  .kpi .s { font-size: 12.5px; color: var(--ink-sub); margin-top: 3px; }
  .ratio { height: 8px; border-radius: 99px; background: var(--grid); margin-top: 10px; display: flex; overflow: hidden; gap: 2px; }
  .ratio span { display: block; height: 100%; }

  /* 計画ボード */
  .board-card { margin-bottom: 14px; }
  .board-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .board-head h2 { margin: 0; flex-wrap: nowrap; }
  .board-head h2 > small { flex: none; }
  .board-head .hint { font-size: 12.5px; color: var(--ink-sub); flex: 1; min-width: 220px; }
  .seg { display: inline-flex; background: var(--bg); border-radius: 11px; padding: 3px; }
  .seg button { border: 0; background: transparent; font-size: 12.5px; font-weight: 800; padding: 6px 11px; border-radius: 9px; color: var(--ink-sub); }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .col { background: var(--bg); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; min-height: 220px; transition: box-shadow .12s, background .12s; }
  .col.stock { background: #efeee7; }
  .col.over { box-shadow: inset 0 0 0 2px var(--ink); background: #fff; }
  .col-h { padding: 4px 4px 10px; }
  .col-h .t { display: flex; align-items: baseline; gap: 6px; font-size: 15px; font-weight: 900; }
  .col-h .t .tag { font-size: 11px; font-weight: 800; color: #fff; background: var(--ink); border-radius: 6px; padding: 1px 6px; }
  .col-h .t .n { font-size: 12px; font-weight: 700; color: var(--ink-sub); margin-left: auto; }
  .col-h .sum { font-size: 20px; font-weight: 900; margin-top: 2px; }
  .col-h .sum small { font-size: 12px; font-weight: 800; margin-left: 1px; }
  .col-list { display: flex; flex-direction: column; gap: 8px; flex: 1; max-height: 62vh; overflow-y: auto; padding: 2px; margin: -2px; }
  .col-empty { font-size: 12.5px; color: var(--ink-sub); text-align: center; padding: 22px 6px; border: 1.5px dashed #d6d5cc; border-radius: 12px; }

  .tile { position: relative; background: #fff; border-radius: 12px; padding: 10px 10px 9px 13px; border: 1px solid var(--line); cursor: grab; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
  .tile::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--k, var(--c-gray)); }
  .tile:hover { border-color: #d6d5cc; }
  .tile.dragging { opacity: .35; }
  .tile .tx { font-size: 13.5px; font-weight: 800; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
  .tile .mt { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 7px; font-size: 11.5px; color: var(--ink-sub); }
  .tile .st { color: var(--c-star); font-size: 12px; letter-spacing: -1px; }
  .tile .carry { font-size: 10.5px; font-weight: 800; color: var(--c-red); border: 1.2px solid color-mix(in srgb, var(--c-red) 40%, #fff); border-radius: 6px; padding: 0 5px; }
  .tile .due { font-weight: 700; }
  .money { margin-left: auto; font-size: 13px; font-weight: 900; color: var(--ink); border: 1.5px dashed transparent; border-radius: 8px; padding: 1px 6px; background: transparent; }
  .money:hover { border-color: #cfcec5; }
  .money.zero { color: var(--ink-sub); font-weight: 800; }
  .money-in { width: 110px; font-size: 14px; font-weight: 900; text-align: right; padding: 3px 7px; border: 1.5px solid var(--ink); border-radius: 8px; outline: none; margin-left: auto; font-variant-numeric: tabular-nums; }
  .ghost { position: fixed; z-index: 50; pointer-events: none; width: 240px; box-shadow: 0 14px 30px rgba(31,36,33,.22); transform: rotate(-2deg); cursor: grabbing; }

  /* タイルの移動メニュー（スマホ・キーボード用） */
  .mv { position: fixed; z-index: 60; background: #fff; border-radius: 14px; box-shadow: 0 12px 34px rgba(31,36,33,.22); padding: 8px; display: flex; flex-direction: column; gap: 4px; min-width: 180px; }
  .mv p { font-size: 12px; font-weight: 800; color: var(--ink-sub); padding: 4px 8px 6px; max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mv button { border: 0; background: transparent; text-align: left; font-size: 14px; font-weight: 800; padding: 9px 10px; border-radius: 9px; }
  .mv button:hover, .mv button:focus-visible { background: var(--bg); outline: none; }
  .mv button[aria-current="true"] { color: var(--ink-sub); }
  .mv button[aria-current="true"]::after { content: '（いまここ）'; font-size: 11px; }
  /* 目標日を月末にそろえる */
  .eom { margin-top: 8px; width: 100%; border: 1.5px dashed #cfcec5; background: #fff; border-radius: 10px; font-size: 12px; font-weight: 800; padding: 6px 8px; color: var(--ink-2); }
  .eom:hover { border-color: var(--ink); color: var(--ink); }
  .cf { position: fixed; z-index: 60; background: #fff; border-radius: 16px; box-shadow: 0 14px 38px rgba(31,36,33,.25); padding: 16px; width: min(360px, calc(100vw - 24px)); }
  .cf h3 { font-size: 15px; font-weight: 900; margin-bottom: 4px; }
  .cf p { font-size: 12.5px; color: var(--ink-sub); margin-bottom: 10px; line-height: 1.5; }
  .cf ul { list-style: none; max-height: 220px; overflow-y: auto; margin-bottom: 12px; border-top: 1px solid var(--grid); }
  .cf li { font-size: 13px; padding: 7px 2px; border-bottom: 1px solid var(--grid); display: flex; gap: 8px; }
  .cf li span { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cf li em { font-style: normal; color: var(--ink-sub); white-space: nowrap; font-size: 12px; }
  .cf .row { display: flex; gap: 8px; justify-content: flex-end; }
  .cf .row button { height: 38px; padding: 0 16px; border-radius: 11px; font-size: 14px; font-weight: 800; border: 1.5px solid var(--line); background: #fff; }
  .cf .row .go { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* グラフ */
  .charts { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; margin-bottom: 14px; }
  .legend { display: flex; gap: 14px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin: -4px 0 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
  svg.chart text { font-family: var(--font); }
  .tip { position: fixed; z-index: 70; pointer-events: none; background: var(--ink); color: #fff; border-radius: 10px; padding: 8px 11px; font-size: 12.5px; line-height: 1.6; box-shadow: 0 8px 22px rgba(0,0,0,.2); white-space: nowrap; }
  .tip b { font-size: 13px; }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .stars-list { display: flex; flex-direction: column; gap: 12px; }
  .srow { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 10px; }
  .srow .k { font-size: 13px; color: var(--c-star); font-weight: 900; letter-spacing: -1px; }
  .srow .k.none { color: var(--ink-sub); letter-spacing: 0; font-size: 12px; }
  .srow .bar { display: grid; grid-template-columns: 1fr 128px; align-items: center; gap: 8px; }
  .srow .track { height: 18px; }
  .srow .fill { display: block; height: 18px; border-radius: 0 4px 4px 0; background: var(--c-star); min-width: 2px; }
  .srow .val { font-size: 13px; font-weight: 900; white-space: nowrap; }
  .srow .val small { font-weight: 700; color: var(--ink-sub); margin-left: 4px; }

  /* 一覧表 */
  .tbl-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .tbl-head h2 { margin: 0; }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; min-width: 760px; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 12px; font-weight: 800; color: var(--ink-sub); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th.r, td.r { text-align: right; }
  th button { border: 0; background: none; font: inherit; color: inherit; }
  th button[aria-pressed="true"] { color: var(--ink); }
  td { padding: 9px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  td.tx { font-weight: 700; max-width: 440px; min-width: 200px; }
  td.r { white-space: nowrap; }
  td.tx div { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  tr.done td { color: var(--ink-sub); }
  tr.done td.tx div { text-decoration: line-through; }
  td .st { color: var(--c-star); letter-spacing: -1px; }
  td .pill { display: inline-block; font-size: 11.5px; font-weight: 800; border-radius: 7px; padding: 2px 7px; background: var(--bg); color: var(--ink-2); white-space: nowrap; }
  td .pill.done { background: color-mix(in srgb, var(--done) 12%, #fff); color: var(--done); }
  tfoot td { font-weight: 900; border-bottom: 0; border-top: 1.5px solid var(--line); }

  .msg { text-align: center; padding: 50px 10px; color: var(--ink-sub); font-weight: 700; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 80; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; box-shadow: 0 8px 20px rgba(0,0,0,.2); }
  .foot { text-align: center; font-size: 11.5px; color: var(--ink-sub); margin-top: 18px; }

  @media (max-width: 1000px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .charts { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .top .upd { display: none; }
    .kpi .v { font-size: 23px; }
    .board { grid-auto-columns: 82%; }
    .btn .lbl { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .btn.spin svg { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img src="logo.png" alt="">
    <div class="ttl"><small>SHINTAKU ToDo</small><b>予算ダッシュボード</b></div>
    <span class="upd num" id="upd"></span>
    <button class="btn" id="reload" type="button" aria-label="最新にする"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span class="lbl">最新にする</span></button>
    <a class="btn link" href="./" aria-label="ToDoアプリを開く"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 13l2 2 4-4"/></svg><span class="lbl">ToDo</span></a>
  </header>

  <div id="app"><div class="msg">読み込み中…</div></div>
  <p class="foot">予算は「暫定予算」、月は「計画月」（決めていないものは目標日の月）で数えています。</p>
</div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  'use strict';
  var API_URL = 'https://script.google.com/macros/s/AKfycbz2n8xBrM_uC9JQrgPYrp3CfpMCsQXEX8q-p41xVZDcbHmf9WKXsn1KnmWfskR8ZObg/exec';
  var MONTHS_AHEAD = 4;           // 計画ボードの月の列（今月から4か月）
  var WD = ['日','月','火','水','木','金','土'];
  var state = { items: [], loaded: false, error: '', show: 'open', sortKey: 'budget', editing: null, busy: 0 };

  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function ym(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function addMonth(key, n){ var p = key.split('-'); var d = new Date(+p[0], +p[1] - 1 + n, 1); return ym(d); }
  function mLabel(key){ var p = key.split('-'); return (+p[1]) + '月'; }
  function mLabelY(key){ var p = key.split('-'); return p[0] + '年' + (+p[1]) + '月'; }
  function yen(n){ return Number(n || 0).toLocaleString('ja-JP'); }
  function money(t){ var n = Number(t.budget); return isNaN(n) ? 0 : n; }
  function fmtDate(s){ if (!s) return ''; var p = s.split('-'); var d = new Date(+p[0], +p[1]-1, +p[2]); return (+p[1]) + '/' + (+p[2]) + '(' + WD[d.getDay()] + ')'; }
  function stars(n){ return '★★★'.slice(0, n || 0); }
  function digits(v){ return String(v || '').replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/[^0-9]/g, '').replace(/^0+(?=\d)/, '').slice(0, 9); }
  var toastT; function toast(m){ var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 2400); }
  var CUR = ym(new Date());
  function isPast(key){ return key < CUR; }

  /* ---------- API ---------- */
  function apiGet(){
    return fetch(API_URL + '?api=list&t=' + Date.now()).then(function(r){ return r.json(); }).then(function(j){ if (!j.ok) throw new Error(j.error || '読み込めませんでした'); return j.items; });
  }
  function apiPost(fn){
    var args = Array.prototype.slice.call(arguments, 1);
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function(r){ return r.json(); }).then(function(j){ if (!j.ok) throw new Error(j.error || '保存できませんでした'); return j.items; });
  }
  function busy(on){ state.busy += on ? 1 : -1; $('reload').classList.toggle('spin', state.busy > 0); }
  function load(){
    busy(true);
    return apiGet().then(function(items){ state.items = items; state.loaded = true; state.error = ''; stamp(); render(); })
      .catch(function(e){ state.error = e.message || '読み込めませんでした'; render(); })
      .then(function(){ busy(false); });
  }
  function stamp(){ var d = new Date(); $('upd').textContent = d.getHours() + ':' + pad(d.getMinutes()) + ' 時点'; }

  /* ---------- 月の決め方 ----------
     計画月（plan）があればその月。none＝未定。空欄なら目標日の月、目標日もなければ未定。 */
  function monthOf(t){
    if (t.plan === 'none') return '';
    if (t.plan) return t.plan;
    return t.due ? t.due.slice(0, 7) : '';
  }
  function columns(){
    var cols = [{ key: 'none', label: '未定', sub: 'ストック' }];
    for (var i = 0; i < MONTHS_AHEAD; i++){ var k = addMonth(CUR, i); cols.push({ key: k, label: mLabel(k), sub: i === 0 ? '今月' : i === 1 ? '来月' : '' }); }
    return cols;
  }
  function colOf(t){   // ボード上の列（過ぎた月は今月へ繰り越し、先の月は最後の列へ）
    var m = monthOf(t); if (!m) return 'none';
    if (m < CUR) return CUR;
    var last = addMonth(CUR, MONTHS_AHEAD - 1);
    return m > last ? last : m;
  }
  function openItems(){ return state.items.filter(function(t){ return !t.done; }); }
  function doneItems(){ return state.items.filter(function(t){ return t.done; }); }
  function sum(arr){ return arr.reduce(function(a, t){ return a + money(t); }, 0); }
  function byStarBudget(a, b){ return (b.priority || 0) - (a.priority || 0) || money(b) - money(a) || (a.date < b.date ? -1 : 1); }

  /* ---------- 画面 ---------- */
  function render(){
    var app = $('app'); app.innerHTML = '';
    if (!state.loaded){ app.appendChild(el('div', 'msg', state.error ? 'つながりません：' + state.error : '読み込み中…')); return; }
    app.appendChild(kpis());
    app.appendChild(board());
    var ch = el('div', 'charts'); ch.appendChild(monthChart()); ch.appendChild(starChart()); app.appendChild(ch);
    app.appendChild(table());
  }

  function kpiCard(label, dot, value, sub, extra){
    var c = el('div', 'card kpi');
    var lb = el('div', 'lb'); if (dot){ var i = el('i'); i.style.background = dot; lb.appendChild(i); } lb.appendChild(document.createTextNode(label)); c.appendChild(lb);
    var v = el('div', 'v num', yen(value)); v.appendChild(el('small', null, '円')); c.appendChild(v);
    c.appendChild(el('div', 's', sub));
    if (extra) c.appendChild(extra);
    return c;
  }
  function kpis(){
    var open = openItems(), done = doneItems();
    var openSum = sum(open), doneSum = sum(done);
    var thisM = open.filter(function(t){ return colOf(t) === CUR; });
    var stock = open.filter(function(t){ return colOf(t) === 'none'; });
    var zero = open.filter(function(t){ return !money(t); }).length;
    var box = el('div', 'kpis');
    box.appendChild(kpiCard('未完了の予算計', 'var(--plan)', openSum, open.length + '件' + (zero ? '（うち予算0円 ' + zero + '件）' : '')));
    box.appendChild(kpiCard('今月（' + mLabel(CUR) + '）にやる分', null, sum(thisM), thisM.length + '件・計画ボードの「' + mLabel(CUR) + '」'));
    box.appendChild(kpiCard('未定（ストック）', null, sum(stock), stock.length + '件・まだ月を決めていない分'));
    var ratio = el('div', 'ratio'); var tot = openSum + doneSum;
    if (tot){ var a = el('span'); a.style.width = (doneSum / tot * 100) + '%'; a.style.background = 'var(--done)'; var b = el('span'); b.style.flex = '1'; b.style.background = 'var(--plan)'; if (doneSum) ratio.appendChild(a); ratio.appendChild(b); }

    var thead = el('thead'), tr = el('tr');
    function th(label, cls, sortKey){ var c = el('th', cls); if (sortKey){ var b = el('button', null, label + (key === sortKey ? ' ▼' : '')); b.type = 'button'; b.setAttribute('aria-pressed', key === sortKey ? 'true' : 'false'); b.addEventListener('click', function(){ state.sortKey = sortKey; render(); }); c.appendChild(b); } else c.textContent = label; tr.appendChild(c); }
    th('内容'); th('★', null, 'star'); th('予算', 'r', 'budget'); th('計画月', null, 'month'); th('目標日'); th('状態'); th('登録者');
    thead.appendChild(tr); tb.appendChild(thead);
    var body = el('tbody');
    arr.forEach(function(t){
      var r = el('tr', t.done ? 'done' : '');
      var c1 = el('td', 'tx'); c1.appendChild(el('div', null, t.text)); r.appendChild(c1);
      var c2 = el('td'); c2.appendChild(el('span', 'st', stars(t.priority))); r.appendChild(c2);
      var c3 = el('td', 'r'); c3.appendChild(moneyCtl(t, 'table')); r.appendChild(c3);
      var c4 = el('td'); var mk = t.done ? '' : colOf(t);
      c4.appendChild(el('span', 'pill', t.done ? '—' : mk === 'none' ? '未定' : mLabel(mk) + (t.plan ? '' : '（目標日）'))); r.appendChild(c4);
      r.appendChild(el('td', 'num', t.due ? fmtDate(t.due) : '—'));
      var c6 = el('td'); c6.appendChild(el('span', 'pill' + (t.done ? ' done' : ''), t.done ? '完了 ' + fmtDate(t.doneDate) : '未完了')); r.appendChild(c6);
      r.appendChild(el('td', null, t.name || ''));
      body.appendChild(r);
    });
    tb.appendChild(body);
    var tf = el('tfoot'), fr = el('tr');
    fr.appendChild(el('td', null, '合計（' + arr.length + '件）')); fr.appendChild(el('td'));
    fr.appendChild(el('td', 'r num', yen(sum(arr)) + '円'));
    var rest = el('td'); rest.colSpan = 4; fr.appendChild(rest);
    tf.appendChild(fr); tb.appendChild(tf);
    wrap.appendChild(tb); card.appendChild(wrap);
    return card;
  }

  $('reload').addEventListener('click', function(){ load(); });
  var wasNarrow = window.innerWidth < 600, rsT;
  window.addEventListener('resize', function(){ clearTimeout(rsT); rsT = setTimeout(function(){ var n = window.innerWidth < 600; if (n !== wasNarrow && !state.editing && !drag){ wasNarrow = n; render(); } }, 200); });
  window.addEventListener('scroll', closeMove, { passive: true });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && !state.editing && !drag) load(); });
  load();
})();
</script>
